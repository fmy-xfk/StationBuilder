plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

apply from: file('../gradle/forge-common.gradle')

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    maven {
        name = "Create Mod Maven"
        url = uri("https://maven.createmod.net/")
    }
    maven {
        name = "Flywheel Maven"
        url = uri("https://maven.tterrag.com")
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation fg.deobf("maven.modrinth:minecraft-transit-railway:FORGE-${mtr_version}+${minecraft_version}")
    implementation fg.deobf('curse.maven:station-decoration-790307:6893847')
    implementation fg.deobf("maven.modrinth:create:mc${project.minecraft_version}-${project.create_version}")
    // compileOnly fg.deobf("net.createmod.ponder:Ponder-Forge-${project.minecraft_version}:1.0.82")
    // compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${project.minecraft_version}:1.0.6")
    // compileOnly fg.deobf("net.createmod.catnip:Catnip-Forge-${project.minecraft_version}:+")
}
