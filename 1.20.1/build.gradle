plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

apply from: rootProject.file("../gradle/fabric-common.gradle")

configurations {
    rawRuntimeMods {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "maven.modrinth:minecraft-transit-railway:FABRIC-${project.mtr_version}+${project.minecraft_version}"

    // MSD FABRIC for MTR 4.0.0 + Minecraft 1.20.1
    modImplementation "curse.maven:station-decoration-790307:6893835"

    // Create Fabric 1.20.1
    modCompileOnly "maven.modrinth:create-fabric:6.0.8.1+build.1744-mc${project.minecraft_version}"
    rawRuntimeMods "maven.modrinth:create-fabric:6.0.8.1+build.1744-mc${project.minecraft_version}"
}

tasks.register('deployModsToRunDir', Copy) {
    from configurations.rawRuntimeMods
    into file("run/mods")
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn 'deployModsToRunDir'
}
