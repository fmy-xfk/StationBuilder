/*
 * Shared Fabric Loom configuration for the 1.20.x targets.
 * Minecraft/Yarn/Fabric/MSD values remain target-specific.
 */

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
    maven {
        name = "CurseForge"
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

// The shared source tree intentionally uses a single main source set.
// Fabric's client entrypoint/classes live in this same source set; client-only
// initialization remains selected by fabric.mod.json's "client" entrypoint.
sourceSets.main {
    java.srcDir rootProject.file("../common/src/main/java")
    resources.srcDir rootProject.file("../common/src/main/resources")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "maven.modrinth:minecraft-transit-railway:FABRIC-${project.mtr_version}+${project.minecraft_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand(
            version: inputs.properties.version,
            minecraft_version: inputs.properties.minecraft_version,
            loader_version: inputs.properties.loader_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from(rootProject.file("../LICENSE")) {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories { }
}

remapJar {
    archiveFileName = "${project.archives_base_name}-FABRIC-${project.mod_version}+${project.minecraft_version}.jar"
}

remapSourcesJar {
    archiveFileName = "${project.archives_base_name}-FABRIC-${project.mod_version}-sources+${project.minecraft_version}.jar"
}
