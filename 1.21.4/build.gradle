plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

apply from: rootProject.file('../gradle/neoforge-base.gradle')

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

dependencies {
    implementation "maven.modrinth:minecraft-transit-railway:NEOFORGE-${project.mtr_version}+${project.minecraft_version}"
    // No Create dependencies here. CreateIntegration is an intentionally inert facade.
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("repo")
        }
    }
}
